name: Compile sing-box rule sets

on:
  push:
    branches:
      - main
    paths:
      - "sing-box/source/**"
      - ".github/workflows/compile-sing-box.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile rule sets
        run: |
          mkdir -p sing-box/rule-set
          for source in sing-box/source/*.json; do
            name="$(basename "$source" .json)"
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              ghcr.io/sagernet/sing-box:latest \
              rule-set compile \
              --output "sing-box/rule-set/${name}.srs" \
              "$source"
          done

      - name: Commit compiled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sing-box/rule-set/*.srs
          if git diff --cached --quiet; then
            echo "No compiled rule changes."
          else
            git commit -m "build: compile sing-box rule sets"
            git push
          fi
